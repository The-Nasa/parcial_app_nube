name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/parcial_1"

      - name: Execute Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/parcial_1
            if [ ! -f .env ]; then
              cat << 'EOF' > .env
SUPABASE_HOST=aws-0-sa-east-1.pooler.supabase.com
SUPABASE_PORT=6543
SUPABASE_DB=postgres
SUPABASE_USER=postgres.hydxnouyyioyxvemboqi
SUPABASE_PASSWORD=61544196Mts
WEATHER_API_KEY=021c05a00ab24cfb88b204516262509
WEATHER_API_URL=https://api.weatherapi.com/v1/forecast.json
SPRING_PROFILES_ACTIVE=prod
EOF
            fi
            docker compose down
            docker compose up --build -d
